hugoblox:
  schema: "2.0"
  identity:
    name: "Julián Cabezas Peña"
    type: "person"
    tagline: "IA y medio ambiente"
    description: "Julián Cabezas Peña, científico de datos y coordinador del equipo de Ciencia de Datos de la SMA. R, Python, SQL, machine learning y análisis geoespacial para el medio ambiente."
    social:
      twitter: "juliancabezasp"
  theme:
    mode: "dark"
    # Tema propio en data/themes/orbital.yaml (paleta de satelite4.jpg).
    pack: "orbital"
  typography:
    # Fuentes propias en data/fonts/orbital.yaml.
    pack: "orbital"
  layout:
    radius: "lg"
    spacing: "comfortable"
    avatar_shape: "circle"
  header:
    enable: true
    style: "navbar"
    sticky: true
    align: "right"
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: true
  footer:
    style: "minimal"
    language_switcher: false
  copyright:
    notice: "© {year} Julián Cabezas Peña"
  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: "apa"
  search:
    enable: true
    suggestions:
      - "R"
      - "SQLite"
      - "Teledetección"
  comments:
    # Desactivado: peso y rastreo de terceros para pocos posts antiguos.
    enable: false
    provider: "disqus"
    disqus:
      shortname: "www-juliancabezas-com"
  analytics:
    google:
      measurement_id: ""
  locale:
    date_format: "02-01-2006"
    time_format: "15:04"
    address_format: "es"
  repository:
    enable: false
    url: "https://github.com/juliancabezas/webpage"
    branch: "master"
    content_dir: "content"
