# HugoBlox Font Pack — Orbital
hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Orbital"
    vendor: "juliancabezas"
    version: "1.0.0"
    license: "MIT"
    description: "Space Grotesk para títulos, Inter para lectura y JetBrains Mono para datos"

  families:
    heading: "Space Grotesk"
    body: "Inter"
    code: "JetBrains Mono"

  weights:
    heading: [500, 600, 700]
    body: [400, 500, 600]
    code: [400, 500]

  leading:
    heading: 1.12
    body: 1.65
    code: 1.5

  tracking:
    heading: "-0.02em"
    body: "0"
