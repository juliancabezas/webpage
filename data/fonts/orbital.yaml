# HugoBlox Font Pack — Orbital
# Una sola superfamilia (IBM Plex): Sans para títulos y lectura, Mono solo para datos (fechas, coordenadas, código).
hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Orbital"
    vendor: "juliancabezas"
    version: "2.0.0"
    license: "MIT"
    description: "IBM Plex Sans para títulos y lectura, IBM Plex Mono para datos"

  families:
    heading: "IBM Plex Sans"
    body: "IBM Plex Sans"
    code: "IBM Plex Mono"

  weights:
    heading: [500, 600, 700]
    body: [400, 500, 600]
    code: [400, 500]

  leading:
    heading: 1.15
    body: 1.65
    code: 1.5

  tracking:
    heading: "-0.015em"
    body: "0"
