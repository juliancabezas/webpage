bio: |
  Soy científico de datos e ingeniero en Recursos Naturales Renovables de la Universidad de Chile, con un Master of Data Science de la University of Adelaide. Integro ciencia de datos, análisis estadístico, machine learning y análisis geoespacial para abordar desafíos ambientales.

  Desde febrero de 2022 coordino el equipo de Ciencia de Datos de la Superintendencia del Medio Ambiente (SMA). Desarrollo soluciones de automatización, validación de datos y análisis para el seguimiento y la fiscalización ambiental, utilizando R, Python y SQL. La automatización del seguimiento de la producción salmonera ha contribuido a generar más del 15 % de los informes de fiscalización de la SMA y más de 1.000 notificaciones a titulares.

  Mi experiencia también incluye visión por computador y deep learning para robótica agrícola, modelamiento de carbono forestal, teledetección y análisis de encuestas. He trabajado en Chile, Australia y Alemania, combinando investigación aplicada, desarrollo de algoritmos y coordinación de equipos interdisciplinarios.
