      Santiago, Chile.

      - Coordinación del equipo de Ciencia de Datos, responsable de paneles, mantenimiento de bases de datos SQL, automatización de procesos y algoritmos de análisis para el seguimiento y la fiscalización ambiental.
      - Automatización del seguimiento y la fiscalización de la producción salmonera con R y bases de datos SQL, generando más del 15 % de los informes de fiscalización de la SMA y más de 1.000 notificaciones a titulares.
