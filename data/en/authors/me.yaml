bio: |
  I am a data scientist with a Master of Data Science from the University of Adelaide and a background in Natural Resources Engineering from Universidad de Chile. I use artificial intelligence, machine learning and statistics to solve real-world problems, with a focus on the environment.

  Since February 2022, I have coordinated the Data Science team at Chile's Superintendence of the Environment (SMA). We build automation, data validation algorithms, dashboards and analyses that support environmental monitoring and enforcement, using R, Python and SQL.

  Previously, I developed deep learning and computer vision models for agricultural robotics, text mining algorithms to classify national survey responses, and forest carbon models. I have worked in Chile, Australia and Germany, across applied research, algorithm development and interdisciplinary team coordination.
